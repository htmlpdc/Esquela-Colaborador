document.getElementById('photoInput').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen válida.');return;}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const grey=document.createElement('canvas');grey.width=im.naturalWidth;grey.height=im.naturalHeight;const g=grey.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);const pixels=g.getImageData(0,0,grey.width,grey.height);for(let i=0;i<pixels.data.length;i+=4){const v=Math.round(pixels.data[i]*0.299+pixels.data[i+1]*0.587+pixels.data[i+2]*0.114);pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=v;}g.putImageData(pixels,0,0);photo=grey;photoScale=1;offsetX=offsetY=0;zoomInput.value='1';document.getElementById('photoControls').classList.add('visible');draw();URL.revokeObjectURL(url);};im.onerror=()=>alert('No se pudo abrir la imagen.');im.src=url;});

function clampOffsets(){if(!photo)return;const s=Math.max(PHOTO.w/photo.width,PHOTO.h/photo.height)*photoScale;const maxX=Math.max(0,(photo.width*s-PHOTO.w)/2),maxY=Math.max(0,(photo.height*s-PHOTO.h)/2);offsetX=Math.max(-maxX,Math.min(maxX,offsetX));offsetY=Math.max(-maxY,Math.min(maxY,offsetY));}

// Vista de guardado compatible con Safari en iPhone.
const safariSaveStyle=document.createElement('style');
safariSaveStyle.textContent=`.safari-save-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:18px 12px 32px;color:#fff;text-align:center;font-family:Arial,sans-serif}.safari-save-overlay.active{display:flex}.safari-save-overlay h2{font-size:21px;margin:10px 0}.safari-save-overlay p{font-size:15px;line-height:1.5;max-width:460px;margin:6px auto 14px}.safari-save-overlay img{display:block;width:min(100%,390px);height:auto;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default;border:1px solid #e4c776}.safari-save-overlay button,.safari-save-overlay a{background:#2355ce;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;text-decoration:none;margin:12px 5px;cursor:pointer}.safari-save-overlay .close-save{background:#555}`;
document.head.appendChild(safariSaveStyle);
const safariSaveOverlay=document.createElement('div');
safariSaveOverlay.className='safari-save-overlay';
safariSaveOverlay.setAttribute('role','dialog');
safariSaveOverlay.setAttribute('aria-modal','true');
safariSaveOverlay.innerHTML='<h2>Guarda tu esquela en Fotos</h2><p>Mantén presionada la imagen y selecciona «Guardar en Fotos» o «Guardar imagen». Si no aparece esa opción, toca «Abrir imagen» y luego mantén presionada la imagen.</p><img alt="Esquela final para guardar en Fotos"><div><a target="_blank" rel="noopener" id="openSafariImage">Abrir imagen</a><button type="button" class="close-save">Cerrar</button></div>';
document.body.appendChild(safariSaveOverlay);
let safariSaveUrl=null;
function showSafariSave(blob){
 if(safariSaveUrl)URL.revokeObjectURL(safariSaveUrl);
 safariSaveUrl=URL.createObjectURL(blob);
 safariSaveOverlay.querySelector('img').src=safariSaveUrl;
 safariSaveOverlay.querySelector('a').href=safariSaveUrl;
 safariSaveOverlay.classList.add('active');
 document.body.style.overflow='hidden';
}
safariSaveOverlay.querySelector('.close-save').addEventListener('click',()=>{safariSaveOverlay.classList.remove('active');document.body.style.overflow='';});
// Guardado adaptado a dispositivos móviles y computadoras.
const saveStatus=document.getElementById('status');
function downloadFallback(blob,filename){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download=filename;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  saveStatus.textContent='La imagen se descargó. Revisa la carpeta Descargas de tu dispositivo.';
}
function canvasPngBlob(){return new Promise((resolve,reject)=>{
  canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('No se pudo generar la imagen.')),'image/png');
});}
document.getElementById('download').addEventListener('click',async()=>{
  if(!photo){saveStatus.textContent='Primero sube una fotografía para completar la esquela.';return;}
  if(!nameInput.value.trim()||!areaInput.value.trim()||!getMundo()||!paisInput.value.trim()){
    saveStatus.textContent='Completa el nombre y el área, mundo y país antes de descargar.';return;
  }
  const button=document.getElementById('download');
  button.disabled=true;saveStatus.textContent='Preparando imagen...';
  try{
    draw();
    const filename='Esquela_'+nameInput.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'.png';
    const blob=await canvasPngBlob();
    const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(navigator.userAgent));
    const isIOSSafari=/iP(hone|ad|od)/i.test(navigator.userAgent)&&/Safari/i.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(navigator.userAgent);
    if(isIOSSafari){
      showSafariSave(blob);
      saveStatus.textContent='Mantén presionada la imagen para guardarla en Fotos.';
      return;
    }
    if(isMobile&&typeof navigator.share==='function'){
      const file=new File([blob],filename,{type:'image/png'});
      if(!navigator.canShare||navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file]});
          saveStatus.textContent='En el menú de compartir, elige «Guardar imagen» o «Guardar en Fotos» para añadirla al carrete.';
          return;
        }catch(err){
          if(err.name==='AbortError'){
            saveStatus.textContent='Guardado cancelado. Puedes pulsar «Descargar esquela» para intentarlo de nuevo.';
            return;
          }
          // Si compartir archivos no está disponible, se usa la descarga normal.
        }
      }
    }
    if(!isMobile&&typeof window.showSaveFilePicker==='function'){
      try{
        const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Imagen PNG',accept:{'image/png':['.png']}}]});
        const writable=await handle.createWritable();
        await writable.write(blob);await writable.close();
        saveStatus.textContent='Esquela guardada en la ubicación que elegiste.';
        return;
      }catch(err){
        if(err.name==='AbortError'){
          saveStatus.textContent='Guardado cancelado.';
          return;
        }
      }
    }
    downloadFallback(blob,filename);
    if(isMobile){
      saveStatus.textContent='Imagen descargada. Para guardarla en Fotos, abre la imagen desde Descargas y elige «Guardar imagen» o «Guardar en Fotos», según tu celular.';
    }
  }catch(err){
    saveStatus.textContent='No se pudo guardar la esquela. Inténtalo nuevamente.';
    console.error(err);
  }finally{button.disabled=false;}
});
