const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const nameInput=document.getElementById('fullName'),areaInput=document.getElementById('area'),mundoInput=document.getElementById('mundo'),paisInput=document.getElementById('pais'),zoomInput=document.getElementById('zoom');
const PHOTO={x:405,y:900,w:280,h:390};let photo=null,photoScale=1,offsetX=0,offsetY=0;
function fitText(text,maxWidth,initialSize,minSize){let size=initialSize;do{ctx.font=`800 ${size}px Poppins, Arial, sans-serif`;if(ctx.measureText(text).width<=maxWidth)break;size-=1;}while(size>minSize);return size;}
function draw(){if(!background.complete||!background.naturalWidth)return;ctx.clearRect(0,0,1100,1380);ctx.drawImage(background,0,0,1100,1380);
ctx.fillStyle='#0d0d0d';ctx.fillRect(398,895,295,400);
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e6c977';
let name=nameInput.value.trim()||'Nombre y Apellido';let size=fitText(name,890,52,18);ctx.font=`800 ${size}px Poppins, Arial, sans-serif`;ctx.fillText(name,550,587,890);
let area=[areaInput.value.trim()||'Área',getMundo()||'Mundo',paisInput.value.trim()||'País'].join(', ');size=fitText(area,830,31,16);ctx.font=`600 ${size}px Poppins, Arial, sans-serif`;ctx.fillText(area,550,648,830);
ctx.save();const r=9;ctx.beginPath();ctx.roundRect(PHOTO.x-3,PHOTO.y-3,PHOTO.w+6,PHOTO.h+6,r);ctx.fillStyle='#e4c776';ctx.fill();ctx.beginPath();ctx.roundRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h,5);ctx.clip();if(photo){const scale=Math.max(PHOTO.w/photo.width,PHOTO.h/photo.height)*photoScale;const dw=photo.width*scale,dh=photo.height*scale;ctx.drawImage(photo,PHOTO.x+(PHOTO.w-dw)/2+offsetX,PHOTO.y+(PHOTO.h-dh)/2+offsetY,dw,dh);}else{ctx.fillStyle='#151515';ctx.fillRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);ctx.fillStyle='#e4c776';ctx.font='500 21px Poppins, Arial, sans-serif';ctx.fillText('Tu fotografía aquí',550,1085);}ctx.restore();}
const otherWorldInput=document.getElementById('otherWorld');const otherWorldWrap=document.getElementById('otherWorldWrap');function getMundo(){return mundoInput.value==='OTROS'?otherWorldInput.value.trim():mundoInput.value.trim()}mundoInput.addEventListener('change',()=>{otherWorldWrap.hidden=mundoInput.value!=='OTROS';draw()});otherWorldInput.addEventListener('input',draw);background.onload=draw;document.fonts.ready.then(draw);nameInput.addEventListener('input',draw);areaInput.addEventListener('input',draw);mundoInput.addEventListener('input',draw);paisInput.addEventListener('input',draw);
document.getElementById('photoInput').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen válida.');return;}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const grey=document.createElement('canvas');grey.width=im.naturalWidth;grey.height=im.naturalHeight;const g=grey.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);const pixels=g.getImageData(0,0,grey.width,grey.height);for(let i=0;i<pixels.data.length;i+=4){const v=Math.round(pixels.data[i]*0.299+pixels.data[i+1]*0.587+pixels.data[i+2]*0.114);pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=v;}g.putImageData(pixels,0,0);photo=grey;photoScale=1;offsetX=offsetY=0;zoomInput.value='1';document.getElementById('photoControls').classList.add('visible');draw();URL.revokeObjectURL(url);};im.onerror=()=>alert('No se pudo abrir la imagen.');im.src=url;});
zoomInput.addEventListener('input',()=>{photoScale=Number(zoomInput.value);clampOffsets();draw()});document.getElementById('resetPhoto').addEventListener('click',()=>{offsetX=offsetY=0;photoScale=1;zoomInput.value='1';draw()});
function clampOffsets(){if(!photo)return;const s=Math.max(PHOTO.w/photo.width,PHOTO.h/photo.height)*photoScale;const maxX=Math.max(0,(photo.width*s-PHOTO.w)/2),maxY=Math.max(0,(photo.height*s-PHOTO.h)/2);offsetX=Math.max(-maxX,Math.min(maxX,offsetX));offsetY=Math.max(-maxY,Math.min(maxY,offsetY));}
let dragging=false,lastX=0,lastY=0;canvas.addEventListener('pointerdown',e=>{if(!photo)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*1100/rect.width,y=(e.clientY-rect.top)*1380/rect.height;if(x<PHOTO.x||x>PHOTO.x+PHOTO.w||y<PHOTO.y||y>PHOTO.y+PHOTO.h)return;dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();offsetX+=(e.clientX-lastX)*1100/rect.width;offsetY+=(e.clientY-lastY)*1380/rect.height;lastX=e.clientX;lastY=e.clientY;clampOffsets();draw()});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('download').addEventListener('click',()=>{if(!photo){document.getElementById('status').textContent='Primero sube una fotografía para completar la esquela.';return;}if(!nameInput.value.trim()||!areaInput.value.trim()||!getMundo()||!paisInput.value.trim()){document.getElementById('status').textContent='Completa el nombre y el área, mundo y país antes de descargar.';return;}document.getElementById('status').textContent='';draw();const a=document.createElement('a');a.download='Esquela_'+nameInput.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();});
</script></body></html>
